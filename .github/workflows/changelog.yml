name: Changelog

# Writes the release note on main, after a pull request lands.
#
# Branches do not touch src/lib/changelog.json at all. That is the point: two
# branches both prepending an entry to the same file conflict every time, and
# no amount of CI can resolve that after the fact. Only main writes, so there
# is nothing to conflict over.
#
# changelog-check.yml previews this same note on the pull request before it
# merges, from the same script, and fails on a title or bullet that would
# record a wrong one.
#
# Requires contents: write. If main is a protected branch, this workflow's
# push will be rejected unless the app or a PAT is allowed to bypass the
# protection — set that up, or the job will fail loudly rather than silently
# skipping the note.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  # For the failure comment at the end. Without it that step gets a 403.
  pull-requests: write

jobs:
  record:
    # Only a merged PR produces a release note. A closed-without-merging PR
    # changed nothing.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Work out the entry
        id: entry
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node .github/scripts/pr-to-changelog.mjs >> "$GITHUB_OUTPUT"

      # A merge that changed nothing main did not already have records
      # nothing. #47 and #49 carried the same commit, and whichever merged
      # second still recorded the fix a second time. A pull request that only
      # corrects changelog.json lands here too, rather than adding a note
      # about itself.
      - name: Check the merge changed something
        id: changed
        if: steps.entry.outputs.skip != 'true'
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet "$MERGE_SHA^1" "$MERGE_SHA" -- . ':(exclude)src/lib/changelog.json'; then
            echo "::notice::#$PR_NUMBER changed nothing main did not already have, so it records no entry."
            echo "record=false" >> "$GITHUB_OUTPUT"
          else
            echo "record=true" >> "$GITHUB_OUTPUT"
          fi

      # Back-to-back merges each start a run from the same main, so whichever
      # pushes second is rejected. Each attempt rebuilds the entry on the
      # current main, so the version is bumped from whatever is newest by then
      # rather than colliding with the run that won.
      #
      # The title goes through the environment, not into the script text. A
      # PR title is anyone's to write: interpolated, a quote truncates it, a
      # backtick runs it, and this job holds a token that can push to main.
      # changeArgs is already shell-quoted by pr-to-changelog.mjs.
      - name: Record it
        if: steps.changed.outputs.record == 'true'
        env:
          ENTRY_TYPE: ${{ steps.entry.outputs.type }}
          ENTRY_TITLE: ${{ steps.entry.outputs.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin +refs/heads/main:refs/remotes/origin/main
            git reset --quiet --hard origin/main

            # A re-run, or a second run for the same merge, must not record it twice.
            recorded=$(git log -1 --format=%h -E --grep="^chore\(changelog\): record [0-9.]+ from #$PR_NUMBER\$" origin/main)
            if [ -n "$recorded" ]; then
              echo "::notice::#$PR_NUMBER already has a changelog entry."
              exit 0
            fi

            node scripts/changelog.mjs add \
              --type "$ENTRY_TYPE" \
              --title "$ENTRY_TITLE" \
              ${{ steps.entry.outputs.changeArgs }}

            if git diff --quiet -- src/lib/changelog.json; then
              echo "Changelog unchanged; nothing to commit."
              exit 0
            fi

            version=$(node -p "require('./src/lib/changelog.json')[0].version")
            git add src/lib/changelog.json
            git commit --quiet -m "chore(changelog): record $version from #$PR_NUMBER"
            if git push --quiet origin HEAD:main; then
              echo "Recorded $version."
              exit 0
            fi

            echo "main moved while recording (attempt $attempt of 5); trying again on the new main."
            sleep $((attempt * 5))
          done

          echo "::error::main kept moving; the entry could not be pushed after 5 attempts."
          exit 1

      # A silently missing release note is the failure mode this whole workflow
      # exists to prevent, so say so on the pull request that caused it.
      - name: Report a failure on the pull request
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '**No changelog entry was recorded for this pull request.**',
                '',
                'The Changelog workflow failed: ' +
                  `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Add the entry by hand with `node scripts/changelog.mjs add`, or re-run the workflow once the cause is fixed.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            })
