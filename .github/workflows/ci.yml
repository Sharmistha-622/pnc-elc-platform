name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Changelog
        run: node scripts/changelog.mjs check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # The build only needs these to be present and well-formed; it does
          # not talk to Supabase. Real values live in the deployment env.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder

  # Every migration, applied to a throwaway Postgres that behaves like a fresh
  # Supabase project, then read as each role. Fails if any persona can see a
  # row the RBAC matrix denies it — the database is the last line, so it gets
  # its own check rather than trusting the app's.
  rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The baseline schema is a Postgres 17 dump.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: RLS probe
        run: scripts/rls-probe.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      # The vault's walls: every table, sequence and function service-role
      # only, the payroll audit trail append-only, locked runs immutable.
      - name: Vault probe
        run: scripts/vault-probe.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
